services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-trainbooking}
      POSTGRES_USER: ${DB_USER:-trainuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-trainpass123}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-trainuser} -d ${DB_NAME:-trainbooking}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    networks:
      - app-network

  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${DB_NAME:-trainbooking}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-trainuser}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-trainpass123}
      FARE_BASE_RATE: ${FARE_BASE_RATE:-15}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    depends_on:
      - backend
    ports:
      - "3000:3000"
    networks:
      - app-network

volumes:
  pgdata:

networks:
  app-network:
    driver: bridge
